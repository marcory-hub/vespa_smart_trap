<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vespa Smart Trap: Cursor Show &amp; Tell</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="theme" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />
    <style>
      .reveal table { font-size: 0.55em; margin: 0 auto; }
      .reveal table th, .reveal table td { padding: 0.3em 0.5em; vertical-align: top; }
      .reveal pre code { max-height: 420px; }
      .reveal .slide-image { max-height: 320px; border-radius: 4px; }
      .reveal .two-images img { max-height: 260px; margin: 0 0.5em; }
      .reveal h2 { text-transform: none; }
      .reveal .small { font-size: 0.7em; }
      .reveal .links a { color: #6db3f2; }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
          data-charset="utf-8"
        ></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        slideNumber: "c/t",
        width: 1280,
        height: 720,
        margin: 0.08,
        transition: "slide",
        plugins: [RevealMarkdown, RevealHighlight],
      });
    </script>
  </body>
</html>
